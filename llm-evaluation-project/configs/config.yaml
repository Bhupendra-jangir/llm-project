# ============================================================
# Enhanced LLM Evaluation Framework – Main Configuration
# ============================================================

# --- LLM Backend ---
llm:
  provider: "mock"          # mock | openai | gemini | anthropic | groq | openrouter | ollama
  model: "mock-model"       # provider-specific model name
  # Examples:
  #   openai:    gpt-4o, gpt-4o-mini, gpt-3.5-turbo
  #   gemini:    gemini-1.5-pro, gemini-1.5-flash
  #   anthropic: claude-3-5-sonnet-20241022, claude-3-haiku-20240307
  #   groq:      llama-3.3-70b-versatile, mixtral-8x7b-32768
  #   ollama:    llama3.2, mistral
  temperature: 1.0
  max_tokens: 5
  top_p: 1.0

# --- G-Eval Scoring Mode ---
geval:
  score_mode: "logprobs"    # logprobs | sampling
  n_samples: 20             # used when score_mode=sampling
  use_cot: true             # whether to use chain-of-thought steps
  dimensions:               # which dimensions to evaluate
    - coherence
    - consistency
    - fluency
    - relevance

# --- Multi-Model Comparison (Experiment C) ---
judge_models:
  - provider: "mock"
    model: "mock-model-a"
    label: "Mock-Judge-A"
  - provider: "mock"
    model: "mock-model-b"
    label: "Mock-Judge-B"
  - provider: "mock"
    model: "mock-model-c"
    label: "Mock-Judge-C"

# --- Fresh Response Generation (Experiment C, optional) ---
generate_responses:
  enabled: false            # set true once API keys are available
  models: []
  n_articles: 100
  prompt: "Please write a concise, accurate summary of the following news article in 3-4 sentences:\n\n{article}"

# --- Engineering / Reliability ---
concurrency_limit: 5        # max simultaneous API calls
max_retries: 5
retry_base_delay: 1.0       # seconds, exponential backoff
cache_dir: "data/cache"     # SQLite cache location
cache_db: "data/cache/llm_cache.db"

# --- Experiment Settings ---
data:
  summeval_path: "data/summeval.json"
  human_ratings_path: "data/human_ratings.csv"
  random_seed: 42

experiments:
  limit: null               # null = full run; integer = subsample for testing
  dry_run: false

# Experiment D: human validation subset
human_validation:
  n_samples: 160
  stratify_by:
    - system_id
    - human_overall_tertile

# Experiment E: bootstrap CI
bootstrap:
  n_resamples: 1000
  random_seed: 42
  confidence_level: 0.95

# Experiment G: unified score
unified_score:
  weights:                  # default fixed weights (sum to 1)
    geval: 0.40
    bertscore: 0.25
    rouge: 0.15
    ensemble_agreement: 0.20
  grid_search_step: 0.05
  learned_combiner:
    enabled: true
    cv_folds: 5
    models:
      - ridge
      - gradient_boosting

# --- BERTScore ---
bertscore:
  preferred_model: "roberta-large"
  fallback_model: "distilbert-base-uncased"

# --- Results ---
results_dir: "results"
mock_results_dir: "results/_mock"
figures_dpi: 300

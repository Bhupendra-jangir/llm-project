llm:
  provider: mock
  model: mock-model
  temperature: 1.0
  max_tokens: 5
  top_p: 1.0
  requests_per_minute: 60

geval:
  score_mode: logprobs
  n_samples: 20
  dimensions:
    - coherence
    - consistency
    - fluency
    - relevance
  ablations:
    - full
    - no_cot
    - no_description

judge_models:
  - provider: mock
    model: mock-model-a
    label: Mock-Judge-A
  - provider: mock
    model: mock-model-b
    label: Mock-Judge-B
  - provider: mock
    model: mock-model-c
    label: Mock-Judge-C

generate_responses:
  enabled: false
  models: []
  n_articles: 100
  prompt: "Please write a concise, accurate summary of the following news article in 3-4 sentences:\n\n{article}"

engineering:
  concurrency_limit: 5
  max_retries: 5
  retry_base_delay: 1.0
  request_timeout_seconds: 120

# These top-level aliases keep existing experiment entry points compatible.
concurrency_limit: 5
max_retries: 5
retry_base_delay: 1.0

data:
  summeval_path: data/summeval.json
  human_ratings_path: data/human_ratings.csv
  expected_records: 1600
  expected_documents: 100
  expected_systems: 16
  random_seed: 42

cache:
  path: data/cache/llm_cache.db
cache_db: data/cache/llm_cache.db

experiments:
  limit: 20
  bootstrap_resamples: 1000
  confidence_level: 0.95
  seed: 42

bootstrap:
  n_resamples: 1000
  confidence_level: 0.95
  random_seed: 42

human_validation:
  n_samples: 160
  strata:
    - system_id
    - score_quartile

unified_score:
  default_weights:
    geval: 0.40
    bertscore: 0.25
    rouge: 0.15
    ensemble_agreement: 0.20
  grid_search_step: 0.05
  learned_combiner:
    enabled: true
    cv_folds: 5
    models:
      - ridge

bertscore:
  preferred_model: roberta-large
  fallback_model: distilbert-base-uncased
  batch_size: 16

results:
  real_dir: results
  mock_dir: results/_mock
  figures_dir: figures
  figures_dpi: 300
results_dir: results
mock_results_dir: results/_mock
figures_dpi: 300

cost_estimate:
  average_input_tokens_per_record: 500
  average_output_tokens_per_record: 5
